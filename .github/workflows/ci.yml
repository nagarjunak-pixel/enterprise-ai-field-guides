name: Enterprise AI Field Guides Integrity & Metadata CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify-pdfs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pymupdf
      - run: python3 scripts/verify_guides.py
